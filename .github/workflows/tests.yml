name: Backend-independent Python tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Test source definitions / geometry / camera adapter
        run: python -m pytest -q
      - name: Source-config export smoke test (no GPU required)
        run: python -m eggtrans.mcx_export --mode Spot --voxel-mm 2 --scan-lines 3 --output results/ci_case
# Physics tests intentionally require a CUDA runner and explicit RUN_MCX_PHYSICS=1.
