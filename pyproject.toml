[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egg-transmission"
version = "0.1.0"
description = "Interactive Monte Carlo prototype for spatial hyperspectral egg transmission"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["numpy>=1.24,<3", "numba>=0.60", "scipy>=1.11", "pandas>=2.1", "plotly>=5.20", "streamlit>=1.37", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["eggtrans*"]

[tool.pytest.ini_options]
testpaths = ["tests"]