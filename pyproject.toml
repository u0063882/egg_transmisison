[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "egg-transmission"
version = "0.4.0"
description = "Interactive egg transmission pushbroom simulator using MCX photon transport"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["numpy>=1.24,<3", "pmcx>=0.8.1,<0.9", "pandas>=2.1", "plotly>=5.20", "streamlit>=1.37", "matplotlib>=3.7"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.setuptools.packages.find]
include = ["eggtrans*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: requires a supported MCX runtime and hardware"]
